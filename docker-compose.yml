services:
  spec:
    build:
      context: .
      dockerfile: docker/spec/Dockerfile
    profiles:
      - compile
    volumes:
      - ./spec/tsp-output:/spec/tsp-output

  prism:
    image: stoplight/prism:5
    command: mock -p 4010 --host 0.0.0.0 --multiprocess false /spec/openapi.yaml
    volumes:
      - ./spec/tsp-output:/spec
    ports:
      - "4010:4010"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
